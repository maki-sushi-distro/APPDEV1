<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="changeColorBtn">Change background</button>
    <p id="messageLine">This sentence will change in 2 seconds.</p>

    <script>
      const button = document.getElementById("changeColorBtn");
      button.addEventListener("click", () => {
        const color = prompt("What background color should we use?");
        document.body.style.backgroundColor = color;
      });

      const message = document.getElementById("messageLine");
      setTimeout(() => {
        message.textContent = "This sentence have changed 2 seconds ago.";
      }, 2000);
    </script>
  </body>
</html>
